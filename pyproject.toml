[project]
name = "local-ultradeepsearch"
version = "0.1.0"
description = "Local two-phase deep research agent (HITL brief + Lite/Full pipeline) on Ollama."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "charset-normalizer>=3.5.2",
    "click>=8.5.0",
    "datasketch>=2.0.0",
    "ddgs>=9.16.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langdetect>=1.0.9",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "markdown-it-py>=4.2.0",
    "mcp>=2.3.0",
    "ollama>=0.6.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "trafilatura>=2.2.0",
    "typer>=0.27.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
udr = "app.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

# --- Quality gate numbers live here (see AGENTS.md §5.4) ---

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "PT", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]  # FastAPI's idiom: `key: ApiKey = Depends(auth)`

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests", ".claude/hooks"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = ["live: needs real Ollama or network; excluded from the gate, run with -m live"]
xfail_strict = true
session_timeout = 60

[tool.coverage.run]
branch = true
source = ["src", ".claude/hooks"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
