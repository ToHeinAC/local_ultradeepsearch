# Numeric budgets per tier (PRD §3.8). Keys are added here as milestones start to use them.
# Every number a prompt or a limit depends on lives here, never in code (PRD AD3).

[light]
credit_cap = 60             # Tavily credits per run
source_analysis_cap = 6     # long-source analyses per run
long_source_words = 5000    # a source this long gets a summarize-role map-reduce analysis

[full]
credit_cap = 300
source_analysis_cap = 6
long_source_words = 5000

# Phase 1 (the brief): interview and upload limits (PRD M4).
[phase1]
max_rounds = 5                  # clarification rounds
max_questions_per_round = 5
max_files = 10                  # uploads per session
max_file_mb = 50
max_total_pages = 500           # PDF pages; other files count in parts of pseudo_page_chars
ocr_min_chars = 50              # a PDF page with less text is OCRed
ocr_dpi = 200
upload_digest_words = 500       # the digest of all uploads inside the brief
pseudo_page_chars = 3000
max_facts_per_part = 25         # facts the summarize role may list per part of an upload
language_min_chars = 20         # shorter first messages do not decide the interview language
language_min_probability = 0.9

# Word and citation ranges by response format (PRD 3.8), the same for both tiers.
[response_formats.short]
words = [500, 2000]
citations = [15, 30]

[response_formats.structured]
words = [2000, 5000]
citations = [40, 80]

[response_formats.argumentative]
words = [5000, 10000]
citations = [80, 150]

# Phase 2 (PRD 3.8, M5). Per tier: how much to search, fetch and read. Ranges are [low, high].
[research.light]
sources_min = 10
planned_searches = [8, 20]
adversarial_min = 5
deduped_urls = [15, 30]        # URLs fetched in the first wave
fetch_waves = [1, 2]
must_read_notes = [8, 15]      # notes the sections are written from
readability_cap = 50           # readability recommendations per report

[research.full]
sources_min = 45
planned_searches = [40, 100]
adversarial_min = 5
deduped_urls = [60, 100]
fetch_waves = [2, 3]
must_read_notes = [20, 50]
readability_cap = 50

# Thresholds of both tiers.
[research.rules]
coverage_matrix_max_iterations = 3
thinking_num_predict = 16384       # the thinking calls of steps 1 and 2 use 8000-11500 tokens
thin_item_sources = 2              # an atomic item with fewer sources is thin
well_covered_sources = 4           # ... and with this many or more, well covered
plan_supplement_rounds = 2         # extra model calls to fill what a search plan lacks
wave2_queries_per_item = [2, 3]
wave2_urls_per_item = 5
search_max_results = 10
pack_context_fraction = 0.6        # share of the reason prompt budget given to evidence
condensed_share = 0.2              # of that budget, kept free for condensed overflow evidence
pack_passages = 4                  # passages from a full-text search added to a section's evidence
passage_chars = 1200               # the longest passage taken from one source
hunk_max_chars = 1200              # AD5: the `old` text of a hunk
section_over_factor = 1.15         # a section this many times its word budget is compressed
section_under_factor = 0.85        # ... below this many times it, expanded once
gate_fix_rounds = 3
citation_density_min = 9           # citations per 1000 body words (G4)
quote_min_words = 5                # quoted spans of fewer words are not checked (G6)
retraction_window_chars = 200      # G9
language_samples = 3               # G12
length_tolerance = [0.8, 1.2]      # G3: body words between 0.8 x low and 1.2 x high

# The service (PRD M6): the API process and the worker.
[service]
worker_poll_s = 2                            # seconds between two looks at the queue
sse_poll_s = 1                               # seconds between two looks at a run's event file
session_threads = 2                          # Phase-1 jobs that run at the same time
summarize_models = ["gemma4:e4b", "gemma4:e2b"]  # what a run's `summarize_model` may be
