# Our own SearXNG metasearch (PRD §3.3), first in the web search chain. Loopback only.
# Start: SEARXNG_SECRET=$(openssl rand -hex 32) docker compose -f deploy/searxng/compose.yaml up -d
services:
  searxng:
    # Pin by digest once pulled (see README.md); `latest` is only the starting point.
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET (openssl rand -hex 32)}
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:ro
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
